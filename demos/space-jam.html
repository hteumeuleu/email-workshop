<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Space Jam</title>
	<style>
		body {
			max-width: 600px;
			margin: 1em auto;
		}

		.example-table {
			border-spacing: 1px;
			border-collapse: revert;
			border: 1px outset #000;
			inline-size: auto;
		}

		.example-table td {
			border: 1px inset #000;
			font-family: serif;
		}
	</style>
</head>
<body>
	<table class="example-table" cellspacing="1" cellpadding="1" border="1">
		<tr>
			<td colspan="2">Press Box Shuttle</td>
			<td>Jam Central</td>
			<td>Planet B-Ball</td>
			<td>Lunar Tunes</td>
		</tr>
		<tr>
			<td>The Lineup</td>
			<td colspan="3" rowspan="2">Space Jam</td>
			<td>Jump Station</td>
		</tr>
		<tr>
			<td>Junior Jam</td>
			<td rowspan="2">Warner Studio Store</td>
		</tr>
		<tr>
			<td></td>
			<td>Stellar Souvenirs</td>
			<td>Site Map</td>
			<td>Behind the Jam</td>
		</tr>
	</table>
	<p>Inspired by <a href="https://www.spacejam.com/1996/jam.html">Space Jam’s 1996 website</a>.</p>
</body>
</html>
